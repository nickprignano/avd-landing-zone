name: validate

# Static checks on every PR and on master; subscription what-if when enabled.
# Nothing here deploys.
on:
  pull_request:
    paths:
      - 'bicep/**'
      - 'parameters/**'
      - 'scripts/**'
      - 'bicepconfig.json'
      - 'ps-rule.yaml'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - master
    paths:
      - 'bicep/**'
      - 'parameters/**'
      - 'scripts/**'
      - 'bicepconfig.json'
      - 'ps-rule.yaml'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

# Placeholder identity values so the .bicepparam files compile offline.
env:
  AVD_USERS_GROUP_ID: 00000000-0000-0000-0000-000000000001
  AVD_ADMINS_GROUP_ID: 00000000-0000-0000-0000-000000000002
  AVD_SERVICE_PRINCIPAL_ID: 00000000-0000-0000-0000-000000000003
  AVD_LOCAL_ADMIN_PASSWORD: Placeholder-only-for-build-1!

jobs:
  bicep:
    name: Bicep lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install && az bicep version

      # bicepconfig.json promotes the security-relevant linter rules to errors.
      - name: Lint
        run: az bicep lint --file bicep/main.bicep

      - name: Build template and parameter files
        run: |
          az bicep build --file bicep/main.bicep --stdout > /dev/null
          for f in parameters/*.bicepparam; do
            echo "build-params $f"
            az bicep build-params --file "$f" --stdout > /dev/null
          done

  scripts:
    name: Script analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer (session host scripts)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path scripts/sessionhost -Recurse -Severity Warning,Error -EnableExit

      - name: shellcheck (deploy script)
        run: shellcheck scripts/deploy/deploy.sh

  psrule:
    name: PSRule for Azure (Well-Architected)
    runs-on: ubuntu-latest
    needs: bicep
    # Advisory until you have reviewed and baselined the findings for your org;
    # remove continue-on-error to make it a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install && echo "$HOME/.azure/bin" >> "$GITHUB_PATH"

      - name: Analyze
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: parameters/
          outputFormat: Markdown
          outputPath: reports/ps-rule.md
          summary: true

  what-if:
    name: Subscription what-if (dev)
    runs-on: ubuntu-latest
    needs: bicep
    # Opt-in: set repo variable AZURE_WHATIF_ENABLED=true. See docs/ci.md.
    if: ${{ vars.AZURE_WHATIF_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    env:
      AVD_USERS_GROUP_ID: ${{ vars.AVD_USERS_GROUP_ID }}
      AVD_ADMINS_GROUP_ID: ${{ vars.AVD_ADMINS_GROUP_ID }}
      AVD_SERVICE_PRINCIPAL_ID: ${{ vars.AVD_SERVICE_PRINCIPAL_ID }}
      AVD_LOCAL_ADMIN_PASSWORD: ${{ secrets.AVD_LOCAL_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment sub what-if \
            -n "avdlz-whatif-${GITHUB_RUN_ID}" \
            -l "${{ vars.AZURE_LOCATION }}" \
            -p parameters/dev.bicepparam
