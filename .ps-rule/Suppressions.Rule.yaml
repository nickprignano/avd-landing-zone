# PSRule suppressions for this landing zone.
# Each group suppresses one rule for a stated reason. Review these when the
# design changes; everything not listed here must pass for CI to go green.

---
# Synopsis: Profile shares keep 14 days of soft delete; the rule checks for exactly 7 days, not a minimum.
apiVersion: github.com/microsoft/PSRule/v1
kind: SuppressionGroup
metadata:
  name: FileShareSoftDeleteRetentionLongerThanDefault
spec:
  rule:
    - Azure.Storage.FileShareSoftDelete
  if:
    field: type
    in:
      - Microsoft.Storage/storageAccounts
      - Microsoft.Storage/storageAccounts/fileServices

---
# Synopsis: Session hosts are patched by Intune (Windows Update for Business) and drained/replaced by image, not by Azure maintenance configurations.
apiVersion: github.com/microsoft/PSRule/v1
kind: SuppressionGroup
metadata:
  name: SessionHostPatchingViaIntune
spec:
  rule:
    - Azure.VM.MaintenanceConfig
  if:
    field: type
    equals: Microsoft.Compute/virtualMachines

---
# Synopsis: Log Analytics workspace replication doubles ingestion cost; enable it per organization DR requirements.
apiVersion: github.com/microsoft/PSRule/v1
kind: SuppressionGroup
metadata:
  name: LogAnalyticsReplicationIsAnOrgDecision
spec:
  rule:
    - Azure.Log.Replication
  if:
    field: type
    equals: Microsoft.OperationalInsights/workspaces

---
# Synopsis: False positive in the AVM Key Vault module's 'keys' parameter (key definitions, not secret values); this landing zone creates no keys.
apiVersion: github.com/microsoft/PSRule/v1
kind: SuppressionGroup
metadata:
  name: AvmKeyVaultKeysParameter
spec:
  rule:
    - Azure.Deployment.SecureParameter
  if:
    name: '.'
    equals: key-vault

---
# Synopsis: Defender for Storage malware scanning covers blobs; the profile account is FileStorage with SMB shares only.
apiVersion: github.com/microsoft/PSRule/v1
kind: SuppressionGroup
metadata:
  name: MalwareScanNotApplicableToFileStorage
spec:
  rule:
    - Azure.Defender.Storage.MalwareScan
  if:
    allOf:
      - field: type
        equals: Microsoft.Security/pricings
      - name: '.'
        equals: StorageAccounts

---
# Synopsis: Replication alerts apply to Azure Site Recovery, which this landing zone does not use; backup job alerts go through Azure Monitor.
apiVersion: github.com/microsoft/PSRule/v1
kind: SuppressionGroup
metadata:
  name: NoSiteRecoveryReplication
spec:
  rule:
    - Azure.RSV.ReplicationAlert
  if:
    field: type
    equals: Microsoft.RecoveryServices/vaults

---
# Synopsis: The NAT Gateway's public IP is attached through the gateway (properties.natGateway); the rule only recognizes properties.ipConfiguration, so it reports every NAT Gateway IP as unattached. Found by the live -WellArchitected review.
apiVersion: github.com/microsoft/PSRule/v1
kind: SuppressionGroup
metadata:
  name: NatGatewayPublicIpIsAttached
spec:
  rule:
    - Azure.PublicIP.IsAttached
  if:
    allOf:
      - field: type
        equals: Microsoft.Network/publicIPAddresses
      - name: '.'
        startsWith: 'pip-ng-'

---
# Synopsis: Session host disks are encrypted at host (end to end, including temp disk and caches), which Microsoft recommends over Azure Disk Encryption; the rule only recognizes ADE settings on the disk. Found by the live -WellArchitected review.
apiVersion: github.com/microsoft/PSRule/v1
kind: SuppressionGroup
metadata:
  name: EncryptionAtHostInsteadOfAde
spec:
  rule:
    - Azure.VM.ADE
  if:
    field: type
    equals: Microsoft.Compute/disks
